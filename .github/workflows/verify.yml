name: Verify Eureka Atlas
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check benchmark-fallback.js
          node --check benchmark-lab.js
          node --check sw.js
      - name: Run regression suite
        run: |
          node tests/release_verification.test.cjs
          node tests/benchmark_lab.test.cjs
          node tests/benchmark_fallback.test.cjs
