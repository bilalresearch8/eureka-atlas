name: Verify Eureka Atlas
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check benchmark-fallback.js
          node --check benchmark-lab.js
          node --check benchmark-targets.js
          node --check scaleup-studio.js
          node --check evidence-explorer.js
          node --check evidence-audit.js
          node --check sw.js
      - name: Check release and strict publication dates
        run: node tests/release_verification.test.cjs
      - name: Check Benchmark Lab structure
        run: node tests/benchmark_lab.test.cjs
      - name: Check Crossref fallback and quota guards
        run: node tests/benchmark_fallback.test.cjs
      - name: Check DOE targets and publication horizons
        run: node tests/industrial_reference.test.cjs
      - name: Check first-principles scale-up balances and units
        run: node tests/scaleup_studio.test.cjs
      - name: Check source-linked evidence plots and scientific comparability
        run: node tests/evidence_explorer.test.cjs
      - name: Check deterministic evidence audits
        run: node tests/evidence_audit.test.cjs
      - name: Check verified offline shell
        run: node tests/service_worker.test.cjs
