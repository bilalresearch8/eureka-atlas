name: Eureka Atlas v16 release patch

on:
  push:
    branches:
      - release/eureka-atlas-v16-2026-09-13

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eureka-atlas-v16-2026-09-13
      - name: Apply release patch
        run: python tools/v16_patch.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' in attrs or 'src=' in attrs:
                  continue
              blocks.append(body)
          Path('/tmp/eureka-inline.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/eureka-inline.js
      - name: Commit release candidate
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Eureka Atlas v16 — strengthen exact-source retrieval'
          git push origin HEAD:release/eureka-atlas-v16-2026-09-13
