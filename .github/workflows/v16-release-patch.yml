name: Eureka Atlas v16 release patch

on:
  push:
    branches:
      - 'release/eureka-atlas-v16-2026-09-13'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eureka-atlas-v16-2026-09-13
      - name: Patch index.html for v16
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def sub(pattern, repl, label, flags=re.S):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {n}')
              s = s2

          s = s.replace("const APP_VERSION='15';", "const APP_VERSION='16';")
          s = s.replace('Eureka Atlas v15 · source-resilient, browser-first, and GitHub Pages ready.', 'Eureka Atlas v16 · source-resilient, browser-first, and GitHub Pages ready.')
          s = s.replace("v15 automatically uses Crossref's current stable pagination behavior", "v16 uses Crossref plus an independent OpenAlex fallback, even without an OpenAlex key, while keeping exact journal/date verification")

          sub(r"async function fetchOpenAlexTopic\(topic,from,to,signal\)\{.*?\}\nasync function fetchOpenAlexJournalInventory",
          r'''async function fetchOpenAlexTopic(topic,from,to,signal){
  const key=$('openAlexKey').value.trim();
  if(!$('tryOpenAlex').checked)return [];
  const issns=[...selectedJournals].flatMap(n=>journalMeta(n)?.issns||[]).slice(0,100);
  if(!issns.length)return [];
  const filter=[`from_publication_date:${from}`,`to_publication_date:${to}`,'type:article',`primary_location.source.issn:${issns.join('|')}`].join(',');
  const params=new URLSearchParams({search:topic.keywords.join(' '),filter,sort:'relevance_score:desc',per_page:'100'});
  if(key)params.set('api_key',key);
  const data=await fetchRetry(`https://api.openalex.org/works?${params}`,signal,28000,2);
  return (data.results||[]).map(it=>{const venue=it.primary_location?.source?.display_name||'',p={recordType:'paper',title:it.title||it.display_name||'Untitled',authors:(it.authorships||[]).slice(0,30).map(a=>a.author?.display_name).filter(Boolean).join(', ')||'Not reported',venue,journalName:'',issns:it.primary_location?.source?.issn||[],date:it.publication_date||'',onlineDate:it.publication_date||'',indexedDate:String(it.updated_date||it.created_date||'').slice(0,10),doi:String(it.doi||'').replace(/^https?:\/\/doi.org\//,''),url:it.doi||it.primary_location?.landing_page_url||it.id,oaUrl:it.best_oa_location?.pdf_url||it.primary_location?.pdf_url||it.open_access?.oa_url||'',abstract:reconstructOpenAlexAbstract(it.abstract_inverted_index),citationCount:Number(it.cited_by_count||0),subjects:(it.topics||[]).map(x=>x.display_name),publisher:it.primary_location?.source?.host_organization_name||'',source:'OpenAlex · publication date',searchKeyword:topic.keywords.join(' '),searchTopic:topic.name,sourceUrls:[]},jm=exactJournalMatch(p);if(jm)p.journalName=jm.name;return p;}).filter(p=>p.journalName&&dateWithin(p.date,from,to));
}
async function fetchOpenAlexJournalInventory''', 'OpenAlex topic fallback')

          sub(r"async function fetchOpenAlexJournalInventory\(journal,topics,from,to,signal\)\{.*?\n\}\n\nasync function enrichSemanticScholar",
          r'''async function fetchOpenAlexJournalInventory(journal,topics,from,to,signal){
  const key=$('openAlexKey').value.trim();
  if(!$('tryOpenAlex').checked||!(journal.issns||[]).length)return [];
  const filter=[`from_publication_date:${from}`,`to_publication_date:${to}`,'type:article',`primary_location.source.issn:${journal.issns.join('|')}`].join(',');
  const all=[];
  for(let page=1;page<=3&&!signal?.aborted;page++){
    const params=new URLSearchParams({filter,sort:'publication_date:desc',per_page:'100',page:String(page)});
    if(key)params.set('api_key',key);
    const data=await fetchRetry(`https://api.openalex.org/works?${params}`,signal,30000,2),batch=data.results||[];
    all.push(...batch);
    if(batch.length<100)break;
  }
  return all.map(it=>{const venue=it.primary_location?.source?.display_name||'',p={recordType:'paper',title:it.title||it.display_name||'Untitled',authors:(it.authorships||[]).slice(0,30).map(a=>a.author?.display_name).filter(Boolean).join(', ')||'Not reported',venue,journalName:journal.name,issns:it.primary_location?.source?.issn||[],date:it.publication_date||'',onlineDate:it.publication_date||'',indexedDate:String(it.updated_date||it.created_date||'').slice(0,10),doi:String(it.doi||'').replace(/^https?:\/\/doi.org\//,''),url:it.doi||it.primary_location?.landing_page_url||it.id,oaUrl:it.best_oa_location?.pdf_url||it.primary_location?.pdf_url||it.open_access?.oa_url||'',abstract:reconstructOpenAlexAbstract(it.abstract_inverted_index),citationCount:Number(it.cited_by_count||0),subjects:(it.topics||[]).map(x=>x.display_name),publisher:it.primary_location?.source?.host_organization_name||'',source:'OpenAlex exact-journal inventory · publication date',searchKeyword:'',searchTopic:'',sourceUrls:[]};return exactJournalMatch(p,journal.name)?p:null;}).filter(p=>p&&dateWithin(p.date,from,to));
}

async function enrichSemanticScholar''', 'OpenAlex exact-journal inventory')

          sub(r"function mergePapers\(rows\)\{.*?\}\nfunction qualify",
          r'''function sourceAuthority(p){const src=String(p?.source||'');if(/Crossref/i.test(src))return 4;if(p?.webVerified&&/publisher|Gemini/i.test(src))return 3;if(/OpenAlex/i.test(src))return 2;return 1;}
function mergePapers(rows){const map=new Map();for(const p of rows){const k=paperKey(p);if(!k||k==='title:')continue;const old=map.get(k);if(!old){map.set(k,p);continue}const trusted=sourceAuthority(p)>sourceAuthority(old)?p:old;map.set(k,{...old,...p,date:trusted.date||old.date||p.date,onlineDate:trusted.onlineDate||old.onlineDate||p.onlineDate,printDate:trusted.printDate||old.printDate||p.printDate,indexedDate:trusted.indexedDate||old.indexedDate||p.indexedDate,matchedDate:trusted.matchedDate||old.matchedDate||p.matchedDate,journalName:trusted.journalName||old.journalName||p.journalName,venue:trusted.venue||old.venue||p.venue,issns:(trusted.issns||[]).length?trusted.issns:(old.issns||p.issns||[]),abstract:(old.abstract||'').length>=(p.abstract||'').length?old.abstract:p.abstract,citationCount:Math.max(old.citationCount||0,p.citationCount||0),oaUrl:old.oaUrl||p.oaUrl,source:Array.from(new Set(`${old.source||''} + ${p.source||''}`.split(' + ').filter(Boolean))).join(' + '),sourceUrls:Array.from(new Set([...(old.sourceUrls||[]),...(p.sourceUrls||[])]))});}return [...map.values()];}
function qualify''', 'metadata authority merge')

          s = s.replace("if(!scanController.signal.aborted&&$('openAlexKey').value.trim()&&$('tryOpenAlex').checked&&selectedJournals.size){", "if(!scanController.signal.aborted&&$('tryOpenAlex').checked&&selectedJournals.size){")
          s = s.replace('Stage 1B — OpenAlex exact-journal rescue', 'Stage 1B — independent OpenAlex exact-journal rescue')
          s = s.replace('Stage 3 — OpenAlex full-text metadata cross-check.', 'Stage 3 — OpenAlex metadata cross-check (keyless fallback supported).')

          if "const APP_VERSION='16';" not in s:
              raise SystemExit('APP_VERSION did not update')
          if "$('openAlexKey').value.trim()&&$('tryOpenAlex').checked" in s:
              raise SystemExit('OpenAlex is still hard-gated on a key')
          if "search:query,filter,sort:'publication_date:desc'" in s:
              raise SystemExit('OpenAlex journal inventory is still relevance-prefiltered')
          if 'function sourceAuthority' not in s:
              raise SystemExit('source authority merge missing')

          p.write_text(s)
          PY
      - name: Syntax and release checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' in attrs or 'src=' in attrs:
                  continue
              blocks.append(body)
          Path('/tmp/eureka-inline.js').write_text('\n'.join(blocks))
          assert "const APP_VERSION='16';" in s
          assert 'OpenAlex exact-journal inventory' in s
          assert "if(key)params.set('api_key',key);" in s
          PY
          node --check /tmp/eureka-inline.js
      - name: Commit release candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Eureka Atlas v16 — strengthen exact-source retrieval' || exit 0
          git push origin HEAD:release/eureka-atlas-v16-2026-09-13
